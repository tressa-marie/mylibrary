<form (ngSubmit)="addBook()">
  <div>
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput id="title" name="title" type="text" [(ngModel)]="book.title" />
    </mat-form-field>
  </div>
  <div class="form-line-group">
<div class="author-field">
    <mat-form-field appearance="outline">
      <mat-label>Author</mat-label>
      <input matInput id="author" name="author" type="text" [(ngModel)]="book.author" />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field appearance="outline" id="author-gender">
      <mat-label>Author Gender</mat-label>
      <mat-select id="author-gender" name="authorGender" [(ngModel)]="book.authorGender" panelClass="author-gender-panel">
        <mat-option value="male">Male</mat-option>
        <mat-option value="female">Female</mat-option>
        <mat-option value="other">Other</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  </div>
  <div>
    <mat-form-field appearance="outline">
      <mat-label>ISBN</mat-label>
      <input matInput id="isbn" name="isbn" type="text" [(ngModel)]="book.isbn" />
    </mat-form-field>
  </div>
  <div class="form-line-group">
    <div>
      <mat-checkbox id="is-read" name="isRead" [(ngModel)]="isRead">Have you read this book?</mat-checkbox>
    </div>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Rating</mat-label>
        <input matInput id="rating" name="rating" type="number" min="0" max="10" [(ngModel)]="book.rating" [disabled]="!isRead" />
      </mat-form-field>
    </div>
  </div>
  <details class="advanced-options">
    <summary>Advanced Options <span class="advanced-arrow" aria-hidden="true">&#9662;</span></summary>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Purchase location</mat-label>
        <input matInput id="purchase-location" name="purchaseLocation" type="text" [(ngModel)]="book.purchaseLocation" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Publisher</mat-label>
        <input matInput id="publisher" name="publisher" type="text" [(ngModel)]="book.publisher" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Publication year</mat-label>
        <input matInput id="publication-year" name="publicationYear" type="number" min="0" [(ngModel)]="book.publicationYear" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Edition</mat-label>
        <input matInput id="edition" name="edition" type="text" [(ngModel)]="book.edition" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Format</mat-label>
        <input matInput id="format" name="format" type="text" [(ngModel)]="book.format" />
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="outline">
        <mat-label>Page count</mat-label>
        <input matInput id="page-count" name="pageCount" type="number" min="0" [(ngModel)]="book.pageCount" />
      </mat-form-field>
    </div>
  </details>
  <button mat-flat-button type="submit">Add Book</button>
</form>
