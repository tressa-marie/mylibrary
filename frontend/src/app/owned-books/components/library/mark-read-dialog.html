<dialog
  #dialog
  aria-labelledby="read-book-title"
  (close)="onClosed()"
  (cancel)="saving() && $event.preventDefault()"
>
  <h2 id="read-book-title">Rate this book</h2>
  <p class="book-title">{{ book()?.title }}</p>
  <form
    #ratingForm="ngForm"
    (ngSubmit)="submit(ratingForm, ratingInput)"
    [attr.aria-busy]="saving()"
  >
    <fieldset [disabled]="saving()">
      <label for="read-book-rating">Rating (0–5)</label>
      <input
        #ratingInput
        #ratingField="ngModel"
        id="read-book-rating"
        name="rating"
        type="number"
        min="0"
        max="5"
        step="any"
        required
        [(ngModel)]="rating"
        autofocus
        [attr.aria-invalid]="submitted() && ratingField.invalid ? 'true' : null"
        [attr.aria-describedby]="submitted() && ratingField.invalid ? 'read-rating-error' : null"
      />
      @if (submitted() && ratingField.invalid) {
        <p id="read-rating-error" class="field-error" role="alert">
          Enter a rating from 0 to 5, or choose Skip.
        </p>
      }
      @if (error()) {
        <div class="field-error" role="alert">
          <p>{{ error() }}</p>
          @if (fieldErrors().length) {
            <ul>
              @for (message of fieldErrors(); track $index) {
                <li>{{ message }}</li>
              }
            </ul>
          }
        </div>
      }
      <div class="actions">
        <button class="secondary" type="button" (click)="skip()" [disabled]="saving()">Skip</button>
        <button type="submit" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Submit' }}</button>
        <button class="secondary" type="button" (click)="cancel()" [disabled]="saving()">
          Cancel
        </button>
      </div>
    </fieldset>
  </form>
</dialog>
