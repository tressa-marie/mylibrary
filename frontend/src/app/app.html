<a class="skip-link" href="#main-content">Skip to content</a>
<header class="header">
  <a class="brand" routerLink="/" aria-label="My Library home">
    <span class="brand-mark" aria-hidden="true">ML</span>
    <span>My Library</span>
  </a>
  <nav aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Home</a
    >
    <a routerLink="/search" routerLinkActive="active" ariaCurrentWhenActive="page">Search books</a>
  </nav>
  <div id="profile-img">
    <img src="assets/puck.png" alt="Profile picture" />
  </div>
</header>
<main id="main-content" tabindex="-1">
  <router-outlet />
</main>
<footer>My Library - Make room for your next chapter.</footer>
